name: 자동 빌드 & 배포

on:
  # Firebase Functions 웹훅이 이 이벤트를 원격으로 트리거
  workflow_dispatch:
  # main 브랜치에 push할 때도 실행
  push:
    branches: [main]
  # Functions 결제가 비활성화되어도 CMS 콘텐츠 변경을 자동 반영
  schedule:
    - cron: '*/10 * * * *'

# 같은 그룹의 빌드가 이미 실행 중이면 취소하고 최신 것만 실행
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Firestore 콘텐츠 변경 확인
        id: content_check
        if: github.event_name == 'schedule'
        run: node scripts/check-content-changes.mjs

      - name: 루트 의존성 설치
        if: github.event_name != 'schedule' || steps.content_check.outputs.changed == 'true'
        run: npm ci

      - name: Functions 의존성 설치
        if: github.event_name != 'schedule' || steps.content_check.outputs.changed == 'true'
        run: cd functions && npm ci

      - name: 사이트 빌드 (Next.js + Vite + finalize)
        if: github.event_name != 'schedule' || steps.content_check.outputs.changed == 'true'
        run: npm run build

      - name: Firebase Hosting 배포
        if: github.event_name != 'schedule' || steps.content_check.outputs.changed == 'true'
        run: npx firebase-tools deploy --only hosting --non-interactive --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # 네이버 봇에게도 알림
      - name: Naver 사이트맵 핑
        if: github.event_name != 'schedule' || steps.content_check.outputs.changed == 'true'
        run: |
          curl -sf "https://searchadvisor.naver.com/xml/ping?sitemap=https://maiptns.com/sitemap.xml" \
            && echo "✅ Naver ping 성공" \
            || echo "⚠️ Naver ping 실패 (무시하고 계속)"
